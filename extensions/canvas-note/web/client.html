<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Canvas Note</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/vendor/katex.css" />
    <link rel="stylesheet" href="/vendor/highlight.css" media="screen" />
    <link rel="stylesheet" href="/vendor/highlight-print.css" media="print" />
    <link rel="stylesheet" href="/content.css" />
    <link rel="stylesheet" href="/client.css" media="screen" />
    <link rel="stylesheet" href="/theme.css" media="screen" />
    <link rel="stylesheet" href="/print.css" media="print" />
    <script defer src="/vendor/marked.js"></script>
    <script defer src="/vendor/purify.js"></script>
    <script defer src="/vendor/echarts.js"></script>
    <script defer src="/vendor/katex.js"></script>
    <script defer src="/vendor/marked-katex.js"></script>
    <script defer src="/vendor/highlight.js"></script>
    <script type="module" src="/client.js"></script>
  </head>
  <body>
    <header class="toolbar">
      <a class="brand" href="#pages">Canvas Note</a>
      <div id="document-id" class="document-id" aria-label="Document directory" hidden></div>
      <div class="selection-tools" role="group" aria-label="Page and block selection">
        <span id="selection-count" role="status">0 selected</span>
        <button id="reply" type="button" class="primary" disabled>Reply</button>
        <button id="clear" type="button" disabled>Clear</button>
      </div>
      <div class="connection-tools">
        <span id="connection" role="status" data-state="connecting">Connecting…</span>
        <button id="export-toggle" type="button" popovertarget="export-menu">Export ▾</button>
        <div id="export-menu" class="export-menu" popover>
          <button id="save-pdf" type="button" disabled>Save PDF</button>
          <button id="save-html" type="button" disabled>Save HTML</button>
          <span id="export-status" role="status"></span>
        </div>
        <button id="shutdown" type="button" disabled>Close server</button>
      </div>
    </header>
    <aside id="outline" class="outline" aria-label="Document outline">
      <div class="outline-header">
        <span class="outline-title">Contents</span>
        <button
          id="outline-toggle"
          class="outline-toggle"
          type="button"
          aria-controls="outline-tree"
          aria-expanded="true"
          aria-label="Collapse contents"
        >
          ‹
        </button>
      </div>
      <div id="outline-mode" class="outline-mode" role="group" aria-label="Contents view">
        <button id="outline-mode-structure" type="button" aria-pressed="true">Structure</button>
        <button id="outline-mode-semantic" type="button" aria-pressed="false">Outline</button>
      </div>
      <nav id="outline-tree" aria-label="Pages and blocks">
        <ul id="outline-list" class="outline-list"></ul>
      </nav>
    </aside>
    <main id="pages" aria-label="Canvas Note pages" tabindex="-1"></main>
    <p id="empty" class="empty">Your canvas is ready. Waiting for a document…</p>
    <dialog id="shutdown-dialog" aria-labelledby="shutdown-title" aria-describedby="shutdown-description">
      <form method="dialog">
        <h2 id="shutdown-title">关闭 Canvas Note 服务？</h2>
        <p id="shutdown-description">所有 Canvas Note 网页将断开连接，已保存的文档保留。下次插入或更新内容时重新启动服务。</p>
        <p id="shutdown-status" role="status"></p>
        <div class="dialog-actions">
          <button id="shutdown-cancel" type="submit" value="cancel">取消</button>
          <button id="shutdown-confirm" type="button" class="primary">确认关闭</button>
        </div>
      </form>
    </dialog>
    <dialog id="reply-dialog" aria-labelledby="reply-title" aria-describedby="reply-context">
      <form id="reply-form">
        <div class="dialog-heading">
          <h2 id="reply-title">Reply to selection</h2>
          <button id="dismiss" type="button" aria-label="Close reply dialog">×</button>
        </div>
        <p id="reply-context" class="muted"></p>
        <ul id="selected-summaries" aria-label="Selected pages and blocks"></ul>
        <label for="reply-text">Your reply</label>
        <textarea id="reply-text" rows="5" placeholder="Share feedback or ask for changes…" required></textarea>
        <p id="reply-status" role="status" aria-live="polite"></p>
        <div class="dialog-actions">
          <button id="cancel" type="button">Cancel</button>
          <button id="submit" type="submit" class="primary">Send reply</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
