<aside id="outline" class="outline" aria-label="Document outline">
  <div class="outline-header">
    <span class="outline-title">Contents</span>
    <button
      id="outline-toggle"
      class="outline-toggle"
      type="button"
      aria-controls="outline-tree"
      aria-expanded="true"
      aria-label="Collapse contents"
    >
      ‹
    </button>
  </div>
  <div id="outline-mode" class="outline-mode" role="group" aria-label="Contents view">
    <button id="outline-mode-semantic" type="button" aria-pressed="false">Outline</button>
    <button id="outline-mode-structure" type="button" aria-pressed="true">Structure</button>
  </div>
  <div id="outline-actions" class="outline-mode" role="group" aria-label="Expand or collapse all contents">
    <button id="outline-expand-all" type="button">Expand all</button>
    <button id="outline-collapse-all" type="button">Collapse all</button>
  </div>
  <nav id="outline-tree" aria-label="Pages and blocks">
    <ul id="outline-list" class="outline-list"></ul>
  </nav>
</aside>
