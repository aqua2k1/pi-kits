<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pi Token Usage Stats</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0d1117;
      --panel: #161b22;
      --panel-border: #30363d;
      --text: #f0f6fc;
      --muted: #8b949e;
      --accent: #58a6ff;
      --accent-strong: #2f81f7;
      --heat-0: #21262d;
      --heat-1: #0e4429;
      --heat-2: #006d32;
      --heat-3: #26a641;
      --heat-4: #39d353;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 34px 0 48px;
    }

    header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 24px;
    }

    h1, h2, p { margin: 0; }
    h1 { font-size: 26px; letter-spacing: -0.02em; }
    h2 { font-size: 16px; }
    .subtitle, .generated { color: var(--muted); }
    .subtitle { margin-top: 4px; }
    .generated { white-space: nowrap; font-size: 12px; }

    .summary-grid {
      margin-bottom: 18px;
    }

    .summary-card, .panel {
      border: 1px solid var(--panel-border);
      border-radius: 10px;
      background: var(--panel);
    }

    .summary-card { padding: 8px 18px; }
    .summary-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      align-items: baseline;
      gap: 20px;
      min-height: 44px;
      padding: 10px 0;
    }

    .summary-row + .summary-row { border-top: 1px solid var(--panel-border); }
    .summary-period { color: var(--muted); font-size: 12px; }
    .summary-value { font-size: 22px; font-weight: 650; white-space: nowrap; }
    .summary-cost { color: var(--muted); font-size: 14px; white-space: nowrap; }

    .panel { padding: 18px; margin-bottom: 18px; }
    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    select {
      max-width: min(420px, 60vw);
      border: 1px solid var(--panel-border);
      border-radius: 6px;
      background: var(--bg);
      color: var(--text);
      padding: 6px 28px 6px 9px;
      font: inherit;
    }

    .bar-chart { display: grid; gap: 14px; }
    .bar-row { min-width: 0; }
    .bar-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 6px;
    }

    .model-name {
      min-width: 0;
      overflow: hidden;
      color: var(--text);
      font-weight: 600;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .model-value { color: var(--muted); font-size: 12px; white-space: nowrap; }
    .bar-track { height: 10px; overflow: hidden; border-radius: 999px; background: #21262d; }
    .bar-fill {
      height: 100%;
      min-width: 2px;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--accent-strong), var(--accent));
      transition: width 160ms ease;
    }

    .empty { color: var(--muted); }
    .heatmap-scroll { overflow-x: auto; padding-bottom: 4px; }
    .calendar { min-width: 760px; }
    .month-row {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 34px repeat(53, minmax(10px, 1fr));
      gap: 4px;
      height: 22px;
      color: var(--muted);
      font-size: 11px;
    }

    .month-labels {
      display: grid;
      grid-column: 2 / -1;
      grid-template-columns: repeat(53, minmax(10px, 1fr));
      grid-template-rows: 16px;
      gap: 4px;
      min-height: 16px;
    }

    .month-label {
      grid-row: 1;
      overflow: visible;
      white-space: nowrap;
    }
    .calendar-body { display: grid; grid-template-columns: 34px 1fr; gap: 0; }
    .weekday-labels {
      display: grid;
      grid-template-rows: repeat(7, 14px);
      gap: 4px;
      padding-top: 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 14px;
    }

    .weekday-labels span:nth-child(odd) { visibility: hidden; }
    .heatmap-grid {
      display: grid;
      grid-template-columns: repeat(53, minmax(10px, 1fr));
      grid-template-rows: repeat(7, 14px);
      gap: 4px;
    }

    .heat-cell {
      display: block;
      width: 100%;
      height: 14px;
      border: 0;
      border-radius: 3px;
      background: var(--heat-0);
      cursor: default;
    }

    .heat-cell.level-1 { background: var(--heat-1); }
    .heat-cell.level-2 { background: var(--heat-2); }
    .heat-cell.level-3 { background: var(--heat-3); }
    .heat-cell.level-4 { background: var(--heat-4); }
    .heat-cell.future { opacity: 0.28; }

    .legend {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 5px;
      margin-top: 12px;
      color: var(--muted);
      font-size: 11px;
    }

    .legend-cell { width: 12px; height: 12px; border-radius: 3px; }
    footer { color: var(--muted); font-size: 12px; text-align: right; }

    @media (max-width: 640px) {
      main { width: min(100% - 20px, 1120px); padding-top: 22px; }
      header { display: block; }
      .generated { margin-top: 6px; }
      .panel { padding: 14px; }
      .panel-header { align-items: flex-start; flex-direction: column; }
      select { max-width: 100%; width: 100%; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Pi Token Usage</h1>
        <p class="subtitle">Aggregated usage across all session snapshots</p>
      </div>
      <div class="generated" id="generated-at"></div>
    </header>

    <section class="summary-grid" aria-label="Usage summary">
      <div class="summary-card">
        <div class="summary-row">
          <span class="summary-period">Total</span>
          <span class="summary-value" id="summary-tokens"></span>
          <span class="summary-cost" id="summary-cost"></span>
        </div>
        <div class="summary-row">
          <span class="summary-period">Last 30 days</span>
          <span class="summary-value" id="summary-30d-tokens"></span>
          <span class="summary-cost" id="summary-30d-cost"></span>
        </div>
        <div class="summary-row">
          <span class="summary-period">Last 24 hours</span>
          <span class="summary-value" id="summary-24h-tokens"></span>
          <span class="summary-cost" id="summary-24h-cost"></span>
        </div>
      </div>
    </section>

    <section class="panel">
      <div class="panel-header">
        <h2 id="heatmap-title">Daily token heatmap</h2>
      </div>
      <div class="heatmap-scroll">
        <div class="calendar">
          <div class="month-row">
            <span></span>
            <div class="month-labels" id="month-labels"></div>
          </div>
          <div class="calendar-body">
            <div class="weekday-labels" aria-hidden="true">
              <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
            </div>
            <div class="heatmap-grid" id="heatmap-grid" role="img" aria-label="Daily token usage"></div>
          </div>
        </div>
      </div>
      <div class="legend">
        <span>Less</span>
        <span class="legend-cell" style="background:var(--heat-0)"></span>
        <span class="legend-cell" style="background:var(--heat-1)"></span>
        <span class="legend-cell" style="background:var(--heat-2)"></span>
        <span class="legend-cell" style="background:var(--heat-3)"></span>
        <span class="legend-cell" style="background:var(--heat-4)"></span>
        <span>More</span>
      </div>
    </section>

    <section class="panel">
      <div class="panel-header">
        <h2>Usage by model</h2>
        <select id="model-filter" aria-label="Filter heatmap by model">
          <option value="__all__">All models</option>
        </select>
      </div>
      <div class="bar-chart" id="model-bars"></div>
    </section>

    <footer>Static snapshot · hover a heatmap cell for daily total and cost</footer>
  </main>

  <script id="stats-data" type="application/json">"{{STATS_DATA}}"</script>
  <script>
    (() => {
      const ALL_MODELS = "__all__";
      const data = JSON.parse(document.getElementById("stats-data").textContent);
      const dateMap = new Map(
        data.dates.map((entry) => [
          entry.day,
          new Map(entry.models.map((model) => [model.model, model])),
        ]),
      );
      const periodMap = new Map(
        Object.entries(data.periods).map(([name, period]) => [
          name,
          {
            total: period.total,
            models: new Map(period.models.map((model) => [model.model, model])),
          },
        ]),
      );
      const filter = document.getElementById("model-filter");

      function createElement(tag, className, text) {
        const element = document.createElement(tag);
        if (className) element.className = className;
        if (text !== undefined) element.textContent = text;
        return element;
      }

      function formatTokens(value) {
        if (value < 1000) return Math.round(value).toLocaleString();
        if (value < 1000000) return `${(value / 1000).toFixed(1)}k`;
        if (value < 1000000000) return `${(value / 1000000).toFixed(1)}M`;
        return `${(value / 1000000000).toFixed(1)}B`;
      }

      function formatCost(value) {
        return `$${value.toFixed(3)}`;
      }

      function emptyTotals() {
        return { totalTokens: 0, cost: 0 };
      }

      function periodTotals(period, model) {
        const selectedPeriod = periodMap.get(period);
        if (!selectedPeriod) return emptyTotals();
        if (model === ALL_MODELS) return selectedPeriod.total;
        return selectedPeriod.models.get(model) || emptyTotals();
      }

      function dailyTotals(day, model) {
        const models = dateMap.get(day);
        if (!models) return emptyTotals();
        if (model !== ALL_MODELS) {
          const selected = models.get(model);
          return selected ? selected : emptyTotals();
        }
        const total = emptyTotals();
        models.forEach((value) => {
          total.totalTokens += value.totalTokens;
          total.cost += value.cost;
        });
        return total;
      }

      function renderSummary(model) {
        const rows = [
          ["total", "summary-tokens", "summary-cost"],
          ["last30Days", "summary-30d-tokens", "summary-30d-cost"],
          ["last24Hours", "summary-24h-tokens", "summary-24h-cost"],
        ];
        rows.forEach(([period, tokenId, costId]) => {
          const totals = periodTotals(period, model);
          document.getElementById(tokenId).textContent = `${formatTokens(totals.totalTokens)} tokens`;
          document.getElementById(costId).textContent = formatCost(totals.cost);
        });
        document.getElementById("heatmap-title").textContent = model === ALL_MODELS ? "Daily token heatmap" : `Daily token heatmap · ${model}`;
      }

      function renderBars() {
        const container = document.getElementById("model-bars");
        container.textContent = "";
        if (data.models.length === 0) {
          container.appendChild(createElement("p", "empty", "No usage data found."));
          return;
        }
        const maximum = Math.max(...data.models.map((entry) => entry.totalTokens), 0);
        data.models.forEach((entry) => {
          const row = createElement("div", "bar-row");
          const heading = createElement("div", "bar-header");
          heading.appendChild(createElement("span", "model-name", entry.model));
          heading.appendChild(
            createElement(
              "span",
              "model-value",
              `${formatTokens(entry.totalTokens)} tokens · ${formatCost(entry.cost)}`,
            ),
          );
          const track = createElement("div", "bar-track");
          const fill = createElement("div", "bar-fill");
          fill.style.width = `${maximum > 0 ? entry.totalTokens / maximum * 100 : 0}%`;
          fill.title = `${entry.model}: ${formatTokens(entry.totalTokens)} tokens, ${formatCost(entry.cost)}`;
          track.appendChild(fill);
          row.appendChild(heading);
          row.appendChild(track);
          container.appendChild(row);
        });
      }

      function dateKey(date) {
        return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
      }

      function startOfDay(date) {
        return new Date(date.getFullYear(), date.getMonth(), date.getDate());
      }

      function addDays(date, days) {
        const result = new Date(date);
        result.setDate(result.getDate() + days);
        return result;
      }

      function heatLevel(value, maximum) {
        if (value <= 0 || maximum <= 0) return 0;
        return Math.max(1, Math.min(4, Math.ceil(Math.log1p(value) / Math.log1p(maximum) * 4)));
      }

      function renderHeatmap(model) {
        const grid = document.getElementById("heatmap-grid");
        const labels = document.getElementById("month-labels");
        grid.textContent = "";
        labels.textContent = "";

        const end = startOfDay(new Date(data.generatedAt));
        const gridStart = addDays(end, -end.getDay() - 52 * 7);
        const cells = [];
        for (let week = 0; week < 53; week++) {
          for (let day = 0; day < 7; day++) {
            const date = addDays(gridStart, week * 7 + day);
            cells.push({ date, totals: date > end ? emptyTotals() : dailyTotals(dateKey(date), model) });
          }
        }
        const maximum = Math.max(...cells.map((cell) => cell.totals.totalTokens), 0);
        const seenMonths = new Set();
        const monthColumns = new Map();
        const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

        for (let weekIndex = 0; weekIndex < 53; weekIndex++) {
          for (let dayIndex = 0; dayIndex < 7; dayIndex++) {
            const cellData = cells[weekIndex * 7 + dayIndex];
            const date = cellData.date;
            const monthId = `${date.getFullYear()}-${date.getMonth()}`;
            if (!seenMonths.has(monthId) && (date.getDate() === 1 || (weekIndex === 0 && dayIndex === 0))) {
              seenMonths.add(monthId);
              // If two month boundaries share a week, prefer the newest label
              // instead of allowing two labels to overlap.
              monthColumns.set(weekIndex, monthNames[date.getMonth()]);
            }
          }
        }

        monthColumns.forEach((monthName, weekIndex) => {
          const month = createElement("span", "month-label", monthName);
          month.style.gridColumn = String(weekIndex + 1);
          month.style.gridRow = "1";
          labels.appendChild(month);
        });

        cells.forEach((cellData, index) => {
          const week = Math.floor(index / 7);
          const day = index % 7;
          const cell = createElement("span", `heat-cell level-${heatLevel(cellData.totals.totalTokens, maximum)}`);
          cell.style.gridColumn = String(week + 1);
          cell.style.gridRow = String(day + 1);
          if (cellData.date > end) cell.classList.add("future");
          const label = `${cellData.date.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" })}: ${formatTokens(cellData.totals.totalTokens)} tokens, ${formatCost(cellData.totals.cost)}`;
          cell.title = label;
          cell.setAttribute("aria-label", label);
          grid.appendChild(cell);
        });
      }

      data.models.forEach((entry) => {
        const option = createElement("option", "", entry.model);
        option.value = entry.model;
        filter.appendChild(option);
      });
      filter.addEventListener("change", () => {
        renderSummary(filter.value);
        renderHeatmap(filter.value);
      });

      document.getElementById("generated-at").textContent = `Snapshot: ${new Date(data.generatedAt).toLocaleString()}`;
      renderBars();
      renderSummary(ALL_MODELS);
      renderHeatmap(ALL_MODELS);
    })();
  </script>
</body>
</html>
